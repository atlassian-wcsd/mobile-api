openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application with Apple Login authentication
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /api/register:
    post:
      summary: Register a new user
      description: Creates a new user account with email verification
      operationId: registerUser
      tags:
        - user-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for user registration
      responses:
        '200':
          description: CORS headers
  
  /api/login:
    post:
      summary: User login
      description: Authenticates a user and returns access tokens
      operationId: loginUser
      tags:
        - user-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for user login
      responses:
        '200':
          description: CORS headers

  /api/verify-email:
    post:
      summary: Verify email address
      description: Verifies a user's email address using a verification token
      operationId: verifyEmail
      tags:
        - user-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for email verification
      responses:
        '200':
          description: CORS headers

  /api/password-reset:
    post:
      summary: Request password reset
      description: Initiates a password reset process by sending an email
      operationId: requestPasswordReset
      tags:
        - user-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset email sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for password reset
      responses:
        '200':
          description: CORS headers

  /api/password-reset-confirm:
    post:
      summary: Confirm password reset
      description: Resets a user's password using a reset token
      operationId: confirmPasswordReset
      tags:
        - user-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid token or password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for password reset confirmation
      responses:
        '200':
          description: CORS headers

  /auth/apple/verify:
    post:
      summary: Verify Apple ID token
      description: Verifies an Apple ID token and returns user information
      operationId: verifyAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token verification
      operationId: verifyAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/refresh:
    post:
      summary: Refresh Apple authentication token
      description: Refreshes an Apple authentication token using a refresh token
      operationId: refreshAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token refresh
      operationId: refreshAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/signout:
    post:
      summary: Sign out Apple user
      description: Signs out a user and revokes their Apple tokens
      operationId: signOutAppleUser
      tags:
        - authentication
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to revoke
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple sign out
      operationId: signOutAppleUserOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/profile:
    get:
      summary: Get Apple user profile
      description: Gets the current user's profile information
      operationId: getAppleUserProfile
      tags:
        - authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple user profile
      operationId: getAppleUserProfileOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleUser:
      type: object
      required:
        - id
        - authToken
        - expiresAt
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: Unique Apple user identifier
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        fullName:
          type: string
          description: User's full name
        isPrivateEmail:
          type: boolean
          description: Whether the email is private
        authToken:
          type: string
          description: Authentication token
        refreshToken:
          type: string
          description: Refresh token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration time
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
    AppleAuthRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple ID token
        authorizationCode:
          type: string
          description: Apple authorization code
        user:
          type: object
          properties:
            name:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            email:
              type: string
              format: email
        state:
          type: string
          description: State parameter for security
    AppleAuthResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        user:
          $ref: '#/components/schemas/AppleUser'
        error:
          type: string
          description: Error message if operation failed
        message:
          type: string
          description: Success or informational message
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    
    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Success message
    
    RateLimitResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Rate limit error message
        remaining:
          type: integer
          description: Number of remaining requests
        resetTime:
          type: string
          description: Time when rate limit resets
    
    User:
      type: object
      required:
        - id
        - username
        - email
        - role
        - emailVerified
        - createdAt
        - updatedAt
        - isActive
      properties:
        id:
          type: string
          description: Unique user identifier
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        fullName:
          type: string
          description: User's full name
        phoneNumber:
          type: string
          description: User's phone number
        role:
          type: string
          description: User's role
          enum: [user, admin, moderator]
        emailVerified:
          type: boolean
          description: Whether the email is verified
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        updatedAt:
          type: string
          format: date-time
          description: Last update time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
        isActive:
          type: boolean
          description: Whether the account is active
    
    UserRegistrationRequest:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Desired username (3-20 characters, alphanumeric, underscore, hyphen)
        password:
          type: string
          minLength: 8
          description: Password (minimum 8 characters with uppercase, lowercase, number, and special character)
        email:
          type: string
          format: email
          description: Email address
        fullName:
          type: string
          maxLength: 100
          description: Full name (optional)
        phoneNumber:
          type: string
          maxLength: 20
          description: Phone number (optional)
    
    UserRegistrationResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether registration was successful
        message:
          type: string
          description: Registration result message
        userId:
          type: string
          description: ID of the created user (if successful)
        error:
          type: string
          description: Error message (if failed)
    
    UserLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username or email address
        password:
          type: string
          description: User's password
    
    UserLoginResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether login was successful
        message:
          type: string
          description: Login result message
        accessToken:
          type: string
          description: Access token (if successful)
        refreshToken:
          type: string
          description: Refresh token (if successful)
        user:
          $ref: '#/components/schemas/User'
        error:
          type: string
          description: Error message (if failed)
    
    EmailVerificationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Email verification token
    
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address for password reset
    
    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Password reset token
        newPassword:
          type: string
          minLength: 8
          description: New password (minimum 8 characters with complexity requirements)
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
