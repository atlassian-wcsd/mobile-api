openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback:
    post:
      summary: Submit user feedback
      operationId: submitFeedback
      tags:
        - feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          description: Invalid request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    options:
      summary: CORS preflight for feedback endpoint
      operationId: feedbackCors
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    FeedbackRequest:
      type: object
      required:
        - userId
        - category
        - rating
        - message
      properties:
        userId:
          type: string
          description: ID of the user submitting feedback
        category:
          type: string
          enum:
            - bug
            - feature_request
            - improvement
            - general
          description: Category of the feedback
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Star rating from 1 to 5
        message:
          type: string
          maxLength: 2000
          description: The feedback message text
        contactEmail:
          type: string
          format: email
          description: Optional contact email for follow-up
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional metadata about the submission
    FeedbackResponse:
      type: object
      properties:
        feedbackId:
          type: string
          description: Unique identifier for the submitted feedback
        status:
          type: string
          enum:
            - submitted
            - error
          description: Status of the feedback submission
        message:
          type: string
          description: Human-readable status message
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
