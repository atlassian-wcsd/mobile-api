openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /submitImage:
    post:
      summary: Submit a signature image and return a durable receipt
      operationId: submitSignatureImage
      tags:
        - signatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureSubmitRequest"
      responses:
        '200':
          description: Signature was persisted and receipt was generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureReceipt"
        '500':
          description: Signature was not fully persisted (no partial receipt returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureSubmitError"
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SignatureSubmitRequest:
      type: object
      required:
        - imageData
      properties:
        imageData:
          type: string
          description: Base64 encoded signature image bytes (data URL supported)
    SignatureReceipt:
      type: object
      required:
        - signatureId
        - s3Key
        - submittedAt
        - imageHash
      properties:
        signatureId:
          type: string
        s3Key:
          type: string
        submittedAt:
          type: string
          format: date-time
        imageHash:
          type: string
          description: SHA-256 hash of the exact bytes stored in S3
    SignatureSubmitError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
