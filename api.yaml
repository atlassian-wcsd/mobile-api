openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application with Apple Login authentication
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /auth/apple/verify:
    post:
      summary: Verify Apple ID token
      description: Verifies an Apple ID token and returns user information
      operationId: verifyAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token verification
      operationId: verifyAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/refresh:
    post:
      summary: Refresh Apple authentication token
      description: Refreshes an Apple authentication token using a refresh token
      operationId: refreshAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token refresh
      operationId: refreshAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/signout:
    post:
      summary: Sign out Apple user
      description: Signs out a user and revokes their Apple tokens
      operationId: signOutAppleUser
      tags:
        - authentication
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to revoke
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple sign out
      operationId: signOutAppleUserOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/profile:
    get:
      summary: Get Apple user profile
      description: Gets the current user's profile information
      operationId: getAppleUserProfile
      tags:
        - authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple user profile
      operationId: getAppleUserProfileOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /feedback:
    post:
      summary: Submit user feedback
      operationId: submitFeedback
      tags:
        - feedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionRequest'
        required: true
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSubmissionResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback/{feedbackId}:
    get:
      summary: Get feedback by ID
      operationId: getFeedback
      tags:
        - feedback
      parameters:
        - name: feedbackId
          in: path
          required: true
          description: The ID of the feedback to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Feedback details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        '404':
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback/user:
    get:
      summary: Get user's feedback history
      operationId: getUserFeedback
      tags:
        - feedback
      parameters:
        - name: userId
          in: query
          required: true
          description: The ID of the user
          schema:
            type: string
      responses:
        '200':
          description: User's feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback/admin/all:
    get:
      summary: Get all feedback (admin only)
      operationId: getAllFeedback
      tags:
        - feedback
        - admin
      parameters:
        - name: limit
          in: query
          description: Maximum number of feedback items to return
          required: false
          schema:
            type: integer
            maximum: 1000
            default: 100
      responses:
        '200':
          description: All feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback/admin/stats:
    get:
      summary: Get feedback statistics (admin only)
      operationId: getFeedbackStats
      tags:
        - feedback
        - admin
      responses:
        '200':
          description: Feedback statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalFeedback:
                        type: integer
                      scannedCount:
                        type: integer
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleUser:
      type: object
      required:
        - id
        - authToken
        - expiresAt
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: Unique Apple user identifier
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        fullName:
          type: string
          description: User's full name
        isPrivateEmail:
          type: boolean
          description: Whether the email is private
        authToken:
          type: string
          description: Authentication token
        refreshToken:
          type: string
          description: Refresh token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration time
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
    AppleAuthRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple ID token
        authorizationCode:
          type: string
          description: Apple authorization code
        user:
          type: object
          properties:
            name:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            email:
              type: string
              format: email
        state:
          type: string
          description: State parameter for security
    AppleAuthResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        user:
          $ref: '#/components/schemas/AppleUser'
        error:
          type: string
          description: Error message if operation failed
        message:
          type: string
          description: Success or informational message
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Feedback:
      type: object
      required:
        - id
        - type
        - rating
        - subject
        - message
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Unique feedback identifier
        userId:
          type: string
          description: User ID who submitted the feedback
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's name
        type:
          type: string
          enum: [bug_report, feature_request, general_feedback, usability_issue, performance_issue, other]
          description: Type of feedback
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1 to 5 stars
        subject:
          type: string
          maxLength: 200
          description: Subject/title of the feedback
        message:
          type: string
          maxLength: 2000
          description: Detailed feedback message
        page:
          type: string
          description: Page/section where feedback was submitted
        userAgent:
          type: string
          description: Browser/device information
        createdAt:
          type: string
          format: date-time
          description: When the feedback was created
        status:
          type: string
          enum: [new, in_review, resolved, closed]
          description: Status of the feedback
        metadata:
          type: object
          properties:
            appVersion:
              type: string
            screenResolution:
              type: string
            timestamp:
              type: string
            url:
              type: string
            context:
              type: object
              additionalProperties: true
    FeedbackSubmissionRequest:
      type: object
      required:
        - type
        - rating
        - subject
        - message
      properties:
        email:
          type: string
          format: email
          description: User's email address (optional)
        name:
          type: string
          description: User's name (optional)
        type:
          type: string
          enum: [bug_report, feature_request, general_feedback, usability_issue, performance_issue, other]
          description: Type of feedback
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1 to 5 stars
        subject:
          type: string
          maxLength: 200
          description: Subject/title of the feedback
        message:
          type: string
          maxLength: 2000
          description: Detailed feedback message
        page:
          type: string
          description: Page/section where feedback was submitted
        metadata:
          type: object
          properties:
            appVersion:
              type: string
            screenResolution:
              type: string
            timestamp:
              type: string
            url:
              type: string
            context:
              type: object
              additionalProperties: true
    FeedbackSubmissionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the feedback submission was successful
        feedbackId:
          type: string
          description: ID of the submitted feedback
        error:
          type: string
          description: Error message if submission failed
        message:
          type: string
          description: Success or additional message
    FeedbackListResponse:
      type: object
      required:
        - success
        - count
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
          description: List of feedback items
        error:
          type: string
          description: Error message if request failed
        count:
          type: integer
          description: Number of feedback items returned
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
