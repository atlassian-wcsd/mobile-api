openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application with Apple Login authentication
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /auth/apple/verify:
    post:
      summary: Verify Apple ID token
      description: Verifies an Apple ID token and returns user information
      operationId: verifyAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token verification
      operationId: verifyAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/refresh:
    post:
      summary: Refresh Apple authentication token
      description: Refreshes an Apple authentication token using a refresh token
      operationId: refreshAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token refresh
      operationId: refreshAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/signout:
    post:
      summary: Sign out Apple user
      description: Signs out a user and revokes their Apple tokens
      operationId: signOutAppleUser
      tags:
        - authentication
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to revoke
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple sign out
      operationId: signOutAppleUserOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/profile:
    get:
      summary: Get Apple user profile
      description: Gets the current user's profile information
      operationId: getAppleUserProfile
      tags:
        - authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple user profile
      operationId: getAppleUserProfileOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /feedback:
    post:
      summary: Submit user feedback
      operationId: submitFeedback
      tags:
        - feedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionRequest'
        required: true
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSubmissionResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    options:
      summary: CORS preflight for feedback submission
      operationId: feedbackOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS headers
  /feedback/history:
    get:
      summary: Get user's feedback history
      operationId: getFeedbackHistory
      tags:
        - feedback
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's feedback history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    options:
      summary: CORS preflight for feedback history
      operationId: feedbackHistoryOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS headers
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleUser:
      type: object
      required:
        - id
        - authToken
        - expiresAt
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: Unique Apple user identifier
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        fullName:
          type: string
          description: User's full name
        isPrivateEmail:
          type: boolean
          description: Whether the email is private
        authToken:
          type: string
          description: Authentication token
        refreshToken:
          type: string
          description: Refresh token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration time
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
    AppleAuthRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple ID token
        authorizationCode:
          type: string
          description: Apple authorization code
        user:
          type: object
          properties:
            name:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            email:
              type: string
              format: email
        state:
          type: string
          description: State parameter for security
    AppleAuthResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        user:
          $ref: '#/components/schemas/AppleUser'
        error:
          type: string
          description: Error message if operation failed
        message:
          type: string
          description: Success or informational message
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    FeedbackSubmissionRequest:
      type: object
      required:
        - rating
        - category
        - subject
        - message
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: User rating from 1 to 5 stars
        category:
          type: string
          enum:
            - bug_report
            - feature_request
            - general_feedback
            - support_request
            - performance_issue
            - ui_ux_feedback
          description: Category of feedback
        subject:
          type: string
          minLength: 3
          maxLength: 100
          description: Brief subject of the feedback
        message:
          type: string
          minLength: 10
          maxLength: 2000
          description: Detailed feedback message
        email:
          type: string
          format: email
          description: Optional email for follow-up
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        timestamp:
          type: string
          format: date-time
          description: Submission timestamp
    FeedbackSubmissionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the submission was successful
        feedbackId:
          type: string
          description: Unique identifier for the submitted feedback
        message:
          type: string
          description: Success message
        error:
          type: string
          description: Error message if submission failed
    FeedbackListResponse:
      type: object
      required:
        - success
        - count
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
          description: List of user's feedback
        count:
          type: integer
          description: Number of feedback items returned
        error:
          type: string
          description: Error message if request failed
    Feedback:
      type: object
      required:
        - id
        - rating
        - category
        - subject
        - message
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Unique feedback identifier
        userId:
          type: string
          description: User who submitted the feedback
        email:
          type: string
          format: email
          description: Contact email
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: User rating
        category:
          type: string
          description: Feedback category
        subject:
          type: string
          description: Feedback subject
        message:
          type: string
          description: Feedback message
        attachments:
          type: array
          items:
            type: string
          description: URLs to attached files
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        status:
          type: string
          enum:
            - submitted
            - in_review
            - resolved
            - closed
          description: Current status of the feedback
        response:
          type: string
          description: Response from support team
        respondedAt:
          type: string
          format: date-time
          description: Response timestamp
        respondedBy:
          type: string
          description: Who responded to the feedback
    DeviceInfo:
      type: object
      properties:
        userAgent:
          type: string
          description: Browser user agent string
        platform:
          type: string
          description: Operating system platform
        screenResolution:
          type: string
          description: Screen resolution (e.g., "1920x1080")
        viewport:
          type: string
          description: Browser viewport size
        timestamp:
          type: string
          format: date-time
          description: When device info was collected
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
