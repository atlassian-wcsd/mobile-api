openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application with Apple Login authentication
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /auth/apple/verify:
    post:
      summary: Verify Apple ID token
      description: Verifies an Apple ID token and returns user information
      operationId: verifyAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token verification
      operationId: verifyAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/refresh:
    post:
      summary: Refresh Apple authentication token
      description: Refreshes an Apple authentication token using a refresh token
      operationId: refreshAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token refresh
      operationId: refreshAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/signout:
    post:
      summary: Sign out Apple user
      description: Signs out a user and revokes their Apple tokens
      operationId: signOutAppleUser
      tags:
        - authentication
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to revoke
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple sign out
      operationId: signOutAppleUserOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/profile:
    get:
      summary: Get Apple user profile
      description: Gets the current user's profile information
      operationId: getAppleUserProfile
      tags:
        - authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple user profile
      operationId: getAppleUserProfileOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /feedback:
    post:
      summary: Submit user feedback
      description: Allows users to submit feedback, bug reports, feature requests, or improvements
      operationId: submitFeedback
      tags:
        - feedback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitRequest'
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmitResponse'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get user feedback history
      description: Retrieves the authenticated user's submitted feedback
      operationId: getFeedback
      tags:
        - feedback
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Feedback retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  feedback:
                    type: array
                    items:
                      $ref: '#/components/schemas/Feedback'
                  count:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for feedback endpoints
      operationId: feedbackOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /metrics/track:
    post:
      summary: Track user metric/event
      description: Records user events, actions, and analytics metrics
      operationId: trackMetric
      tags:
        - metrics
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricTrackRequest'
      responses:
        '200':
          description: Metric tracked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricTrackResponse'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for metrics endpoints
      operationId: metricsOptions
      tags:
        - metrics
      responses:
        '200':
          description: CORS preflight response
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleUser:
      type: object
      required:
        - id
        - authToken
        - expiresAt
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: Unique Apple user identifier
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        fullName:
          type: string
          description: User's full name
        isPrivateEmail:
          type: boolean
          description: Whether the email is private
        authToken:
          type: string
          description: Authentication token
        refreshToken:
          type: string
          description: Refresh token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration time
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
    AppleAuthRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple ID token
        authorizationCode:
          type: string
          description: Apple authorization code
        user:
          type: object
          properties:
            name:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            email:
              type: string
              format: email
        state:
          type: string
          description: State parameter for security
    AppleAuthResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        user:
          $ref: '#/components/schemas/AppleUser'
        error:
          type: string
          description: Error message if operation failed
        message:
          type: string
          description: Success or informational message
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    Feedback:
      type: object
      required:
        - id
        - userId
        - feedbackType
        - title
        - message
        - category
        - createdAt
        - status
        - allowContact
      properties:
        id:
          type: string
          description: Unique feedback identifier
        userId:
          type: string
          description: User ID who submitted the feedback
        feedbackType:
          type: string
          enum: [bug, feature, improvement, general]
          description: Type of feedback
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Optional rating (1-5 stars)
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Feedback title/subject
        message:
          type: string
          minLength: 10
          maxLength: 5000
          description: Detailed feedback message
        category:
          type: string
          description: Category or feature area
        pageContext:
          type: string
          description: Page/screen where feedback was submitted
        userAgent:
          type: string
          description: User agent information
        deviceInfo:
          type: object
          properties:
            platform:
              type: string
            browser:
              type: string
            screenResolution:
              type: string
            isMobile:
              type: boolean
        createdAt:
          type: string
          format: date-time
          description: Timestamp when feedback was submitted
        status:
          type: string
          enum: [pending, reviewed, resolved, closed]
          description: Status of the feedback
        email:
          type: string
          format: email
          description: Optional email for follow-up
        allowContact:
          type: boolean
          description: Whether user allows follow-up contact
        attachmentIds:
          type: array
          items:
            type: string
          description: Optional attachment IDs
        adminNotes:
          type: string
          description: Internal admin notes
        updatedAt:
          type: string
          format: date-time
          description: Last updated timestamp
    FeedbackSubmitRequest:
      type: object
      required:
        - feedbackType
        - title
        - message
        - category
        - allowContact
      properties:
        feedbackType:
          type: string
          enum: [bug, feature, improvement, general]
          description: Type of feedback
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Optional rating (1-5 stars)
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Feedback title/subject
        message:
          type: string
          minLength: 10
          maxLength: 5000
          description: Detailed feedback message
        category:
          type: string
          description: Category or feature area
        pageContext:
          type: string
          description: Page/screen where feedback was submitted
        email:
          type: string
          format: email
          description: Optional email for follow-up
        allowContact:
          type: boolean
          description: Whether user allows follow-up contact
        attachmentIds:
          type: array
          items:
            type: string
          description: Optional attachment IDs
    FeedbackSubmitResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether submission was successful
        feedbackId:
          type: string
          description: ID of submitted feedback
        message:
          type: string
          description: Success or error message
        error:
          type: string
          description: Error details if submission failed
    MetricTrackRequest:
      type: object
      required:
        - eventType
        - eventName
      properties:
        eventType:
          type: string
          description: Type of event (e.g., action, navigation, timing, error)
        eventName:
          type: string
          description: Name of the event
        properties:
          type: object
          additionalProperties: true
          description: Additional event properties
        sessionId:
          type: string
          description: Session ID to group related events
        page:
          type: string
          description: Page/screen where event occurred
        duration:
          type: integer
          format: int64
          description: Duration in milliseconds for timing events
    MetricTrackResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether tracking was successful
        metricId:
          type: string
          description: ID of tracked metric
        message:
          type: string
          description: Success or error message
        error:
          type: string
          description: Error details if tracking failed
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
