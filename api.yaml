openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      summary: API health check endpoint
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        '503':
          description: API is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    HealthCheckResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - services
        - performance
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: Overall API health status
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
        version:
          type: string
          description: API version
        services:
          type: object
          properties:
            s3:
              $ref: "#/components/schemas/ServiceStatus"
            dynamodb:
              $ref: "#/components/schemas/ServiceStatus"
        performance:
          type: object
          properties:
            averageResponseTimeMs:
              type: number
              description: Average response time in milliseconds
            uptime:
              type: string
              description: Service uptime status
    ServiceStatus:
      type: object
      required:
        - status
        - responseTimeMs
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Service health status
        responseTimeMs:
          type: number
          description: Service response time in milliseconds
        message:
          type: string
          description: Optional error or status message
