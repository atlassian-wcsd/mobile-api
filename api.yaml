openapi: "3.0.0"
info:
  version: 1.0.0
  title: Mobile Dev API
  description: API for mobile application with Apple Login authentication
  license:
    name: MIT
servers:
  - url: https://api.yourapp.com/v1
paths:
  /auth/apple/verify:
    post:
      summary: Verify Apple ID token
      description: Verifies an Apple ID token and returns user information
      operationId: verifyAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token verification
      operationId: verifyAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/refresh:
    post:
      summary: Refresh Apple authentication token
      description: Refreshes an Apple authentication token using a refresh token
      operationId: refreshAppleToken
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple token refresh
      operationId: refreshAppleTokenOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/signout:
    post:
      summary: Sign out Apple user
      description: Signs out a user and revokes their Apple tokens
      operationId: signOutAppleUser
      tags:
        - authentication
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to revoke
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple sign out
      operationId: signOutAppleUserOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /auth/apple/profile:
    get:
      summary: Get Apple user profile
      description: Gets the current user's profile information
      operationId: getAppleUserProfile
      tags:
        - authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for Apple user profile
      operationId: getAppleUserProfileOptions
      tags:
        - authentication
      responses:
        '200':
          description: CORS preflight response
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            maximum: 100
            format: int32
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: petAlias
          in: path
          required: false
          description: The alias of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedback:
    post:
      summary: Submit user feedback
      description: Submit feedback from users about the application
      operationId: submitFeedback
      tags:
        - feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionRequest'
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmissionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for feedback submission
      operationId: submitFeedbackOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /feedback/history:
    get:
      summary: Get user feedback history
      description: Retrieve feedback history for the authenticated user
      operationId: getFeedbackHistory
      tags:
        - feedback
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of feedback items to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Feedback history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for feedback history
      operationId: getFeedbackHistoryOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /feedback/stats:
    get:
      summary: Get feedback statistics
      description: Retrieve aggregated feedback statistics (admin only)
      operationId: getFeedbackStats
      tags:
        - feedback
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Feedback statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for feedback stats
      operationId: getFeedbackStatsOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /feedback/category/{category}:
    get:
      summary: Get feedback by category
      description: Retrieve feedback filtered by category
      operationId: getFeedbackByCategory
      tags:
        - feedback
      parameters:
        - name: category
          in: path
          required: true
          description: The feedback category to filter by
          schema:
            $ref: '#/components/schemas/FeedbackCategory'
        - name: limit
          in: query
          description: Maximum number of feedback items to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Feedback retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: CORS preflight for feedback by category
      operationId: getFeedbackByCategoryOptions
      tags:
        - feedback
      responses:
        '200':
          description: CORS preflight response
  /feedback/health:
    get:
      summary: Feedback service health check
      description: Check if the feedback service is healthy
      operationId: feedbackHealthCheck
      tags:
        - feedback
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: feedback
                  timestamp:
                    type: string
                    example: "1640995200"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleUser:
      type: object
      required:
        - id
        - authToken
        - expiresAt
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: Unique Apple user identifier
        email:
          type: string
          format: email
          description: User's email address
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        fullName:
          type: string
          description: User's full name
        isPrivateEmail:
          type: boolean
          description: Whether the email is private
        authToken:
          type: string
          description: Authentication token
        refreshToken:
          type: string
          description: Refresh token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration time
        createdAt:
          type: string
          format: date-time
          description: Account creation time
        lastLoginAt:
          type: string
          format: date-time
          description: Last login time
    AppleAuthRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple ID token
        authorizationCode:
          type: string
          description: Apple authorization code
        user:
          type: object
          properties:
            name:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
            email:
              type: string
              format: email
        state:
          type: string
          description: State parameter for security
    AppleAuthResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        user:
          $ref: '#/components/schemas/AppleUser'
        error:
          type: string
          description: Error message if operation failed
        message:
          type: string
          description: Success or informational message
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    FeedbackCategory:
      type: string
      enum:
        - bug_report
        - feature_request
        - general_feedback
        - user_experience
        - performance
        - other
      description: Category of feedback
    FeedbackStatus:
      type: string
      enum:
        - submitted
        - reviewed
        - in_progress
        - resolved
        - closed
      description: Status of feedback
    DeviceInfo:
      type: object
      properties:
        userAgent:
          type: string
          description: User agent string
        platform:
          type: string
          description: Platform information
        screenResolution:
          type: string
          description: Screen resolution
        viewport:
          type: string
          description: Viewport size
        language:
          type: string
          description: User language
        timezone:
          type: string
          description: User timezone
    FeedbackMetadata:
      type: object
      properties:
        appVersion:
          type: string
          description: Application version
        currentPage:
          type: string
          description: Current page URL
        sessionId:
          type: string
          description: Session identifier
        referrer:
          type: string
          description: Referrer URL
        userId:
          type: string
          description: User identifier
    Feedback:
      type: object
      required:
        - id
        - rating
        - feedbackText
        - category
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Unique feedback identifier
        userId:
          type: string
          description: User identifier (if authenticated)
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: User rating (1-5 stars)
        feedbackText:
          type: string
          minLength: 10
          maxLength: 2000
          description: Feedback text content
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        contactEmail:
          type: string
          format: email
          description: Optional contact email
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        createdAt:
          type: string
          format: date-time
          description: Feedback creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Feedback last update timestamp
        status:
          $ref: '#/components/schemas/FeedbackStatus'
        metadata:
          $ref: '#/components/schemas/FeedbackMetadata'
    FeedbackSubmissionRequest:
      type: object
      required:
        - rating
        - feedbackText
        - category
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: User rating (1-5 stars)
        feedbackText:
          type: string
          minLength: 10
          maxLength: 2000
          description: Feedback text content
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        contactEmail:
          type: string
          format: email
          description: Optional contact email
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        metadata:
          $ref: '#/components/schemas/FeedbackMetadata'
    FeedbackSubmissionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether the submission was successful
        feedbackId:
          type: string
          description: Unique identifier of submitted feedback
        message:
          type: string
          description: Success or error message
        error:
          type: string
          description: Error details if submission failed
    FeedbackListResponse:
      type: object
      required:
        - success
        - feedback
        - count
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
          description: List of feedback items
        count:
          type: integer
          description: Number of feedback items returned
        error:
          type: string
          description: Error message if request failed
    FeedbackStatsResponse:
      type: object
      required:
        - success
        - totalFeedback
        - averageRating
        - categoryBreakdown
        - statusBreakdown
        - recentFeedback
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        totalFeedback:
          type: integer
          description: Total number of feedback items
        averageRating:
          type: number
          format: float
          description: Average rating across all feedback
        categoryBreakdown:
          type: object
          additionalProperties:
            type: integer
          description: Count of feedback by category
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
          description: Count of feedback by status
        recentFeedback:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
          description: Most recent feedback items
        error:
          type: string
          description: Error message if request failed
