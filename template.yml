AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 5

Resources:
  SubmitImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: submitImage/
      Handler: bootstrap
      Runtime: provided.al2
      Tracing: Active
      Environment:
        Variables:
          APPLE_CLIENT_ID: !Ref AppleClientId
          APPLE_TEAM_ID: !Ref AppleTeamId
          APPLE_KEY_ID: !Ref AppleKeyId
          APPLE_PRIVATE_KEY: !Ref ApplePrivateKey
          FROM_EMAIL: !Ref FromEmail
          BASE_URL: !Ref BaseURL
          RECAPTCHA_SECRET_KEY: !Ref RecaptchaSecretKey
      Policies:
        - AmazonDynamoDBFullAccess
        - AmazonS3FullAccess
        - AmazonSESFullAccess
        - AdministratorAccess
      Events:
        # Original image submission endpoint
        CatchAll:
          Type: Api
          Properties:
            Path: /bootstrap
            Method: GET
        # Apple Authentication endpoints
        AppleVerifyToken:
          Type: Api
          Properties:
            Path: /auth/apple/verify
            Method: POST
        AppleVerifyTokenOptions:
          Type: Api
          Properties:
            Path: /auth/apple/verify
            Method: OPTIONS
        AppleRefreshToken:
          Type: Api
          Properties:
            Path: /auth/apple/refresh
            Method: POST
        AppleRefreshTokenOptions:
          Type: Api
          Properties:
            Path: /auth/apple/refresh
            Method: OPTIONS
        AppleSignOut:
          Type: Api
          Properties:
            Path: /auth/apple/signout
            Method: POST
        AppleSignOutOptions:
          Type: Api
          Properties:
            Path: /auth/apple/signout
            Method: OPTIONS
        AppleProfile:
          Type: Api
          Properties:
            Path: /auth/apple/profile
            Method: GET
        AppleProfileOptions:
          Type: Api
          Properties:
            Path: /auth/apple/profile
            Method: OPTIONS
        # User Registration endpoints
        UserRegister:
          Type: Api
          Properties:
            Path: /auth/register
            Method: POST
        UserRegisterOptions:
          Type: Api
          Properties:
            Path: /auth/register
            Method: OPTIONS
        UserVerifyEmail:
          Type: Api
          Properties:
            Path: /auth/verify-email
            Method: POST
        UserVerifyEmailOptions:
          Type: Api
          Properties:
            Path: /auth/verify-email
            Method: OPTIONS
      Tags:
        Name: submitImage
        business_unit: agile_devops_pmm
        service_name: open_devops_image_rec
        resource_owner: wmarusiak

Parameters:
  AppleClientId:
    Type: String
    Description: Apple Client ID for authentication
    Default: ""
  AppleTeamId:
    Type: String
    Description: Apple Team ID for authentication
    Default: ""
  AppleKeyId:
    Type: String
    Description: Apple Key ID for authentication
    Default: ""
  ApplePrivateKey:
    Type: String
    Description: Apple Private Key for authentication (PEM format)
    Default: ""
    NoEcho: true
  FromEmail:
    Type: String
    Description: Email address to send emails from (must be verified in SES)
    Default: "noreply@yourapp.com"
  BaseURL:
    Type: String
    Description: Base URL of the application for email links
    Default: "https://yourapp.com"
  RecaptchaSecretKey:
    Type: String
    Description: Google reCAPTCHA secret key for CAPTCHA verification
    Default: ""
    NoEcho: true

Outputs:
  SubmitImageAPI:
    Description: "API Gateway endpoint URL for Prod environment for Submit Image Function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bootstrap"
  SubmitImageFunction:
    Description: "First Lambda Function ARN"
    Value: !GetAtt SubmitImageFunction.Arn
  SubmitImageFunctionIamRole:
    Description: "Implicit IAM Role created for Submit Image function"
    Value: !GetAtt SubmitImageFunctionRole.Arn
  SubmitImageFunctionName:
    Description: "SubmitImage function name"
    Value: !Ref SubmitImageFunction
    Export:
      Name: SubmitImageFunctionName
