AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 5

Resources:
  SubmitImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: submitImage/
      Handler: bootstrap
      Runtime: provided.al2
      Tracing: Active
      Environment:
        Variables:
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
      Policies:
        - AmazonDynamoDBFullAccess
        - AmazonS3FullAccess
        - AdministratorAccess
      Events:
        # Original image submission endpoint
        CatchAll:
          Type: Api
          Properties:
            Path: /bootstrap
            Method: GET
        # Notification API endpoints
        GetNotifications:
          Type: Api
          Properties:
            Path: /notifications
            Method: GET
        CreateNotification:
          Type: Api
          Properties:
            Path: /notifications
            Method: POST
        GetNotification:
          Type: Api
          Properties:
            Path: /notifications/{notificationId}
            Method: GET
        DeleteNotification:
          Type: Api
          Properties:
            Path: /notifications/{notificationId}
            Method: DELETE
        MarkNotificationRead:
          Type: Api
          Properties:
            Path: /notifications/{notificationId}/read
            Method: PUT
        MarkNotificationUnread:
          Type: Api
          Properties:
            Path: /notifications/{notificationId}/unread
            Method: PUT
        MarkAllNotificationsRead:
          Type: Api
          Properties:
            Path: /notifications/read-all
            Method: PUT
      Tags:
        Name: submitImage
        business_unit: agile_devops_pmm
        service_name: open_devops_image_rec
        resource_owner: wmarusiak

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: isRead
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: IsReadIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: isRead
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  SubmitImageAPI:
    Description: "API Gateway endpoint URL for Prod environment for Submit Image Function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bootstrap"
  SubmitImageFunction:
    Description: "First Lambda Function ARN"
    Value: !GetAtt SubmitImageFunction.Arn
  SubmitImageFunctionIamRole:
    Description: "Implicit IAM Role created for Submit Image function"
    Value: !GetAtt SubmitImageFunctionRole.Arn
  SubmitImageFunctionName:
    Description: "SubmitImage function name"
    Value: !Ref SubmitImageFunction
    Export:
      Name: SubmitImageFunctionName
  NotificationsTableArn:
    Description: "Notifications DynamoDB Table ARN"
    Value: !GetAtt NotificationsTable.Arn
