AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 5

Resources:
  # DynamoDB table for user feedback
  UserFeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserFeedback
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: UserFeedback
        - Key: business_unit
          Value: agile_devops_pmm
        - Key: service_name
          Value: open_devops_image_rec
        - Key: resource_owner
          Value: wmarusiak

  SubmitImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: submitImage/
      Handler: bootstrap
      Runtime: provided.al2
      Tracing: Active
      Environment:
        Variables:
          APPLE_CLIENT_ID: !Ref AppleClientId
          APPLE_TEAM_ID: !Ref AppleTeamId
          APPLE_KEY_ID: !Ref AppleKeyId
          APPLE_PRIVATE_KEY: !Ref ApplePrivateKey
      Policies:
        - AmazonDynamoDBFullAccess
        - AmazonS3FullAccess
        - AdministratorAccess
      Events:
        # Original image submission endpoint
        CatchAll:
          Type: Api
          Properties:
            Path: /bootstrap
            Method: GET
        # Apple Authentication endpoints
        AppleVerifyToken:
          Type: Api
          Properties:
            Path: /auth/apple/verify
            Method: POST
        AppleVerifyTokenOptions:
          Type: Api
          Properties:
            Path: /auth/apple/verify
            Method: OPTIONS
        AppleRefreshToken:
          Type: Api
          Properties:
            Path: /auth/apple/refresh
            Method: POST
        AppleRefreshTokenOptions:
          Type: Api
          Properties:
            Path: /auth/apple/refresh
            Method: OPTIONS
        AppleSignOut:
          Type: Api
          Properties:
            Path: /auth/apple/signout
            Method: POST
        AppleSignOutOptions:
          Type: Api
          Properties:
            Path: /auth/apple/signout
            Method: OPTIONS
        AppleProfile:
          Type: Api
          Properties:
            Path: /auth/apple/profile
            Method: GET
        AppleProfileOptions:
          Type: Api
          Properties:
            Path: /auth/apple/profile
            Method: OPTIONS
        # Feedback endpoints
        FeedbackSubmit:
          Type: Api
          Properties:
            Path: /feedback
            Method: POST
        FeedbackSubmitOptions:
          Type: Api
          Properties:
            Path: /feedback
            Method: OPTIONS
        FeedbackGet:
          Type: Api
          Properties:
            Path: /feedback/{id}
            Method: GET
        FeedbackGetOptions:
          Type: Api
          Properties:
            Path: /feedback/{id}
            Method: OPTIONS
        FeedbackUserGet:
          Type: Api
          Properties:
            Path: /feedback/user
            Method: GET
        FeedbackUserGetOptions:
          Type: Api
          Properties:
            Path: /feedback/user
            Method: OPTIONS
        FeedbackAdminAll:
          Type: Api
          Properties:
            Path: /feedback/admin/all
            Method: GET
        FeedbackAdminAllOptions:
          Type: Api
          Properties:
            Path: /feedback/admin/all
            Method: OPTIONS
        FeedbackAdminStats:
          Type: Api
          Properties:
            Path: /feedback/admin/stats
            Method: GET
        FeedbackAdminStatsOptions:
          Type: Api
          Properties:
            Path: /feedback/admin/stats
            Method: OPTIONS
      Tags:
        Name: submitImage
        business_unit: agile_devops_pmm
        service_name: open_devops_image_rec
        resource_owner: wmarusiak

Parameters:
  AppleClientId:
    Type: String
    Description: Apple Client ID for authentication
    Default: ""
  AppleTeamId:
    Type: String
    Description: Apple Team ID for authentication
    Default: ""
  AppleKeyId:
    Type: String
    Description: Apple Key ID for authentication
    Default: ""
  ApplePrivateKey:
    Type: String
    Description: Apple Private Key for authentication (PEM format)
    Default: ""
    NoEcho: true

Outputs:
  SubmitImageAPI:
    Description: "API Gateway endpoint URL for Prod environment for Submit Image Function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bootstrap"
  SubmitImageFunction:
    Description: "First Lambda Function ARN"
    Value: !GetAtt SubmitImageFunction.Arn
  SubmitImageFunctionIamRole:
    Description: "Implicit IAM Role created for Submit Image function"
    Value: !GetAtt SubmitImageFunctionRole.Arn
  SubmitImageFunctionName:
    Description: "SubmitImage function name"
    Value: !Ref SubmitImageFunction
    Export:
      Name: SubmitImageFunctionName
